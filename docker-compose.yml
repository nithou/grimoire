services:
  grimoire:
    build: .
    image: grimoire-dd:latest
    container_name: grimoire
    restart: unless-stopped
    ports:
      - "${GRIMOIRE_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      ALLOW_REGISTRATION: "${ALLOW_REGISTRATION:-true}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
    volumes:
      - ./data:/data
